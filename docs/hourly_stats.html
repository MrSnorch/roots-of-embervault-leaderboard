<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Embervault — почасовая статистика (24ч)</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<style>
  :root{
    --bg:#0b0e0d;
    --panel:#121613;
    --line:#212823;
    --text:#d7e0d9;
    --dim:#6f7d74;
    --accent:#5ee6a0;
    --hot:#ff6b5e;
  }
  *{box-sizing:border-box}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:"SF Mono","JetBrains Mono",Consolas,monospace;
    margin:0;
    padding:16px 20px;
    font-size:12.5px;
  }
  h1{ display:none; }
  .sub{ color:var(--dim); margin-bottom:12px; font-size:11px; }
  .panel{
    display:flex; align-items:center; gap:8px; flex-wrap:wrap;
    background:var(--panel); border:1px solid var(--line); border-radius:8px;
    padding:8px 10px; margin-bottom:12px;
  }
  .panel .sep{ width:1px; height:20px; background:var(--line); margin:0 2px; }
  input[type=text], select{
    background:var(--bg); border:1px solid var(--line); color:var(--text);
    padding:5px 8px; border-radius:4px; font-family:inherit; font-size:12px;
  }
  input[type=text]{ width:170px; }
  .metric-toggle{ display:flex; gap:2px; background:var(--bg); border:1px solid var(--line); border-radius:4px; padding:2px; }
  .metric-toggle button{
    background:none; border:none; color:var(--dim); padding:4px 10px;
    border-radius:3px; font-size:11px; cursor:pointer; font-family:inherit;
  }
  .metric-toggle button.active{ background:var(--line); color:var(--text); }
  .tablewrap{ overflow-x:auto; border:1px solid var(--line); border-radius:6px; }
  table{ border-collapse:collapse; width:100%; }
  th,td{ padding:4px 7px; text-align:right; border-bottom:1px solid var(--line); white-space:nowrap; font-variant-numeric:tabular-nums; }
  th{ position:sticky; top:0; background:var(--panel); color:var(--dim); font-weight:normal; font-size:10.5px; z-index:2; }
  td.name, th.name{ text-align:left; position:sticky; left:0; background:var(--bg); z-index:1; min-width:130px; font-weight:600; }
  th.name{ background:var(--panel); z-index:3; }
  tr:hover td{ background:#171d19; }
  tr:hover td.name{ background:#171d19; }
  .delta-pos{ color:var(--accent); }
  .delta-hot{ color:var(--hot); font-weight:700; }
  .delta-zero{ color:var(--dim); }
  .online{ color:var(--accent); font-size:9px; }
  .offline{ color:var(--dim); font-size:9px; }
  #summary{ margin-top:10px; color:var(--dim); font-size:11px; }
  #loading{ color:var(--dim); padding:20px 0; }

  header{
    border-bottom:1px solid var(--line); padding:10px 20px;
    display:flex; align-items:center; gap:16px; background:var(--panel);
    margin:-16px -20px 12px; position:sticky; top:0; z-index:10;
  }
  .logo{ font-family:inherit; font-size:16px; font-weight:700; color:var(--accent); letter-spacing:-.5px; }
  .logo span{ color:#a259ff; }
  .tabs{ display:flex; gap:4px; }
  .tab{
    font-size:11.5px; color:var(--dim); text-decoration:none;
    padding:5px 10px; border-radius:6px; border:1px solid transparent;
  }
  .tab:hover{ color:var(--text); border-color:var(--line); }
  .tab.active{ color:var(--text); background:var(--bg); border-color:var(--line); }

  .watch-tags{ display:flex; gap:5px; flex-wrap:wrap; align-items:center; }
  .watch-tag{
    display:flex; align-items:center; gap:5px;
    background:var(--bg); border:1px solid var(--accent);
    color:var(--accent); padding:3px 6px 3px 9px; border-radius:12px; font-size:11px;
  }
  .watch-tag button{
    background:none; border:none; color:var(--accent); cursor:pointer;
    font-size:13px; line-height:1; padding:0; font-family:inherit;
  }
  .watch-tag button:hover{ color:var(--hot); }
  label.watch-only{ display:flex; align-items:center; gap:5px; color:var(--dim); font-size:11px; cursor:pointer; white-space:nowrap; }
  .empty-watchlist{ color:var(--dim); font-size:11px; }

  .top-cards{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:12px; }
  .top-card{
    background:var(--panel); border:1px solid var(--line); border-radius:6px;
    padding:8px 12px; display:flex; align-items:center; justify-content:space-between; gap:8px;
  }
  .top-card .label{ color:var(--dim); font-size:10px; text-transform:uppercase; letter-spacing:.4px; }
  .top-card .name{ font-size:13px; font-weight:700; }
  .top-card .value{ font-size:12px; white-space:nowrap; }
  .top-card.rune .value{ color:var(--hot); }
  .top-card.score .value{ color:var(--accent); }
  .top-card.spike .value{ color:#ffb14e; }

  .watch-chart-wrap{
    background:var(--panel); border:1px solid var(--line); border-radius:8px;
    padding:12px; margin-bottom:12px; display:none;
  }
  .watch-chart-wrap.visible{ display:block; }
  .watch-chart-title{ color:var(--dim); font-size:11px; margin-bottom:8px; }

  .sparkline{ vertical-align:middle; }
  td.rank-cell{ font-size:10.5px; }
  .rank-up{ color:var(--accent); }
  .rank-down{ color:var(--hot); }
  .rank-same{ color:var(--dim); }
</style>
</head>
<body>

<header>
  <div class="logo">ROE<span>·</span>LB</div>
  <nav class="tabs">
    <a href="index.html" class="tab">Dashboard</a>
    <a href="hourly_stats.html" class="tab active">Hourly</a>
  </nav>
</header>

<h1>ROOTS OF EMBERVAULT — почасовая статистика</h1>
<div class="sub">С 00:00 UTC текущих суток (время в таблице — Киев) · читается напрямую из docs/hourly/</div>

<div class="top-cards" id="topCards"></div>

<div class="watch-chart-wrap" id="watchChartWrap">
  <div class="watch-chart-title">Отслеживаемые — динамика по часам</div>
  <canvas id="watchChart" height="70"></canvas>
</div>

<div class="panel">
  <div class="metric-toggle" id="metricToggle">
    <button data-metric="score" class="active">Score</button>
    <button data-metric="rune">Rune</button>
  </div>
  <div class="sep"></div>
  <input type="text" id="watchInput" placeholder="+ добавить в отслеживание" list="playerList" autocomplete="off">
  <datalist id="playerList"></datalist>
  <div class="watch-tags" id="watchTags"></div>
  <label class="watch-only">
    <input type="checkbox" id="watchOnly"> только они
  </label>
  <div class="sep"></div>
  <input type="text" id="filter" placeholder="поиск по нику…">
  <select id="sortBy">
    <option value="totalScoreDelta">рост score</option>
    <option value="totalRuneDelta">рост rune</option>
    <option value="maxHourlyRune">макс. скачок/ч</option>
    <option value="name">по нику</option>
  </select>
</div>

<div id="loading">Загрузка часовых снапшотов…</div>

<div class="tablewrap" style="display:none" id="wrap">
  <table id="tbl">
    <thead><tr id="headRow"></tr></thead>
    <tbody id="body"></tbody>
  </table>
</div>

<div id="summary"></div>

<script>
const HOURLY_DIR = 'hourly'; // relative to this file, matches docs/hourly/

async function fetchHourSnapshot(hourKey){
  const res = await fetch(`${HOURLY_DIR}/${hourKey}.json.gz`);
  if(!res.ok) throw new Error(`missing ${hourKey}`);
  const buf = await res.arrayBuffer();
  const text = pako.inflate(new Uint8Array(buf), { to: 'string' });
  return JSON.parse(text);
}

async function main(){
  const indexRes = await fetch(`${HOURLY_DIR}/index.json`);
  const allHours = await indexRes.json();
  const todayUTC = new Date().toISOString().slice(0, 10); // "2026-07-22"
  const hours = allHours.filter(h => h.slice(0, 10) === todayUTC);

  const data = {};
  await Promise.all(hours.map(async h=>{
    const snap = await fetchHourSnapshot(h);
    data[h] = {};
    for(const [name, p] of Object.entries(snap.players)){
      data[h][name] = { score: p.score, runeCount: p.runeCount, isOnline: p.isOnline, rank: p.rank };
    }
  }));

  const players = Array.from(new Set(hours.flatMap(h=>Object.keys(data[h])))).sort();
  render(hours, players, data);
}

const WATCH_KEY = 'roe_watchlist';
function getWatchlist(){
  try{ return JSON.parse(localStorage.getItem(WATCH_KEY)) || []; }
  catch{ return []; }
}
function setWatchlist(list){
  localStorage.setItem(WATCH_KEY, JSON.stringify(list));
}

function render(hours, players, data){
  document.getElementById('loading').style.display = 'none';
  document.getElementById('wrap').style.display = 'block';

  // datalist for autocomplete
  document.getElementById('playerList').innerHTML =
    players.map(p=>`<option value="${p}">`).join('');

  let watchlist = getWatchlist().filter(p=>players.includes(p));
  setWatchlist(watchlist);

  function renderTags(){
    const el = document.getElementById('watchTags');
    if(watchlist.length===0){
      el.innerHTML = '<span class="empty-watchlist">никого не отслеживаешь</span>';
      return;
    }
    el.innerHTML = watchlist.map(name=>
      `<span class="watch-tag">${name}<button data-name="${name}">×</button></span>`
    ).join('');
    el.querySelectorAll('button').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        watchlist = watchlist.filter(n=>n!==btn.dataset.name);
        setWatchlist(watchlist);
        renderTags();
        draw();
      });
    });
  }

  document.getElementById('watchInput').addEventListener('keydown', e=>{
    if(e.key !== 'Enter') return;
    const val = e.target.value.trim();
    if(!val) return;
    if(!players.includes(val)){
      alert('Игрок не найден за выбранный период: ' + val);
      return;
    }
    if(!watchlist.includes(val)){
      watchlist.push(val);
      setWatchlist(watchlist);
      renderTags();
      draw();
    }
    e.target.value = '';
  });

  const WATCH_ONLY_KEY = 'roe_watch_only';
  const watchOnlyEl = document.getElementById('watchOnly');
  watchOnlyEl.checked = localStorage.getItem(WATCH_ONLY_KEY) === '1';
  watchOnlyEl.addEventListener('change', ()=>{
    localStorage.setItem(WATCH_ONLY_KEY, watchOnlyEl.checked ? '1' : '0');
    draw();
  });

  renderTags();

  const kyivFmt = new Intl.DateTimeFormat('ru-RU', {
    timeZone: 'Europe/Kyiv', hour: '2-digit', minute: '2-digit',
    day: '2-digit', month: '2-digit'
  });
  function toKyiv(hourKey){
    // hourKey like "2026-07-22T12" -> treat as UTC hour, format in Kyiv time
    const d = new Date(hourKey + ':00:00Z');
    return kyivFmt.format(d); // "22.07, 15:00"
  }

  function buildHeader(){
    const headRow = document.getElementById('headRow');
    let h = '<th class="name">игрок</th><th>ранг</th>';
    hours.forEach(hh=>{
      h += `<th>${toKyiv(hh)}</th>`;
    });
    h += `<th>тренд</th><th>Σ ${currentMetric==='score'?'score':'rune'} Δ</th>`;
    headRow.innerHTML = h;
  }
  buildHeader();

  const rows = players.map(name=>{
    const cells = [];
    const scoreSeries = [];
    const runeSeries = [];
    let totalScoreDelta = 0, totalRuneDelta = 0, maxHourlyRune = 0, lastOnline = false, prev = null;
    let firstRank = null, lastRank = null;
    hours.forEach(hh=>{
      const cur = data[hh][name];
      if(cur){
        lastOnline = cur.isOnline;
        lastRank = cur.rank;
        if(firstRank === null) firstRank = cur.rank;
        scoreSeries.push(cur.score);
        runeSeries.push(cur.runeCount);
      }
      if(prev && cur){
        const ds = cur.score - prev.score;
        const dr = cur.runeCount - prev.runeCount;
        totalScoreDelta += ds; totalRuneDelta += dr;
        if(dr > maxHourlyRune) maxHourlyRune = dr;
        cells.push({ds, dr, present:true});
      } else {
        cells.push({ds:null, dr:null, present: !!cur});
      }
      if(cur) prev = cur;
    });
    const rankChange = (firstRank!==null && lastRank!==null) ? firstRank - lastRank : 0; // positive = rank improved (moved up)
    return {name, cells, totalScoreDelta, totalRuneDelta, maxHourlyRune, lastOnline, scoreSeries, runeSeries, lastRank, rankChange};
  });

  function fmt(n){
    if(n===null) return '<span class="delta-zero">—</span>';
    if(n===0) return '<span class="delta-zero">0</span>';
    const cls = n > 5000 ? 'delta-hot' : 'delta-pos';
    return `<span class="${cls}">${n>0?'+':''}${n.toLocaleString('ru')}</span>`;
  }

  function sparkline(series, color){
    if(series.length < 2) return '';
    const w = 90, ht = 24, pad = 2;
    const min = Math.min(...series), max = Math.max(...series);
    const range = (max - min) || 1;
    const step = (w - pad*2) / (series.length - 1);
    const points = series.map((v,i)=>{
      const x = pad + i*step;
      const y = ht - pad - ((v - min) / range) * (ht - pad*2);
      return `${x.toFixed(1)},${y.toFixed(1)}`;
    }).join(' ');
    return `<svg class="sparkline" width="${w}" height="${ht}" viewBox="0 0 ${w} ${ht}">
      <polyline points="${points}" fill="none" stroke="${color}" stroke-width="1.5"/>
    </svg>`;
  }

  let watchChartInstance = null;
  let currentMetric = localStorage.getItem('roe_metric') || 'score';

  document.querySelectorAll('#metricToggle button').forEach(btn=>{
    if(btn.dataset.metric === currentMetric) btn.classList.add('active');
    else btn.classList.remove('active');
    btn.addEventListener('click', ()=>{
      document.querySelectorAll('#metricToggle button').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      currentMetric = btn.dataset.metric;
      localStorage.setItem('roe_metric', currentMetric);
      buildHeader();
      draw();
    });
  });

  function renderTopCards(){
    const withData = rows.filter(r=>r.cells.some(c=>c.present));
    if(withData.length===0){ document.getElementById('topCards').innerHTML=''; return; }

    const topScore = [...withData].sort((a,b)=>b.totalScoreDelta-a.totalScoreDelta)[0];
    const topRune = [...withData].sort((a,b)=>b.totalRuneDelta-a.totalRuneDelta)[0];
    const topSpike = [...withData].sort((a,b)=>b.maxHourlyRune-a.maxHourlyRune)[0];

    document.getElementById('topCards').innerHTML = `
      <div class="top-card score">
        <div class="label">Лидер роста Score (сегодня)</div>
        <div class="name">${topScore.name}</div>
        <div class="value">+${topScore.totalScoreDelta.toLocaleString('ru')}</div>
      </div>
      <div class="top-card rune">
        <div class="label">Лидер фарма Rune (сегодня)</div>
        <div class="name">${topRune.name}</div>
        <div class="value">+${topRune.totalRuneDelta.toLocaleString('ru')}</div>
      </div>
      <div class="top-card spike">
        <div class="label">Самый резкий скачок за 1 час</div>
        <div class="name">${topSpike.name}</div>
        <div class="value">+${topSpike.maxHourlyRune.toLocaleString('ru')} rune/ч</div>
      </div>
    `;
  }

  function renderWatchChart(){
    const wrap = document.getElementById('watchChartWrap');
    if(watchlist.length===0){
      wrap.classList.remove('visible');
      return;
    }
    wrap.classList.add('visible');

    const labels = hours.map(toKyiv);
    const colors = ['#5ee6a0','#ff6b5e','#ffb14e','#5ea0ff','#c25eff','#5edee6'];
    const datasets = watchlist.map((name, i)=>{
      const row = rows.find(r=>r.name===name);
      const series = currentMetric === 'score' ? (row?.scoreSeries||[]) : (row?.runeSeries||[]);
      return {
        label: name,
        data: series,
        borderColor: colors[i % colors.length],
        backgroundColor: 'transparent',
        tension: 0.25,
        pointRadius: 2,
      };
    });

    if(watchChartInstance) watchChartInstance.destroy();
    watchChartInstance = new Chart(document.getElementById('watchChart'), {
      type: 'line',
      data: { labels, datasets },
      options: {
        responsive: true,
        interaction: { mode: 'index', intersect: false },
        plugins: {
          legend: { labels: { color: '#d7e0d9', font: { family: 'monospace', size: 11 } } }
        },
        scales: {
          x: { ticks: { color: '#6f7d74', font: { size: 10 } }, grid: { color: '#212823' } },
          y: { ticks: { color: '#6f7d74', font: { size: 10 } }, grid: { color: '#212823' } }
        }
      }
    });
  }

  function draw(){
    const filter = document.getElementById('filter').value.toLowerCase();
    const sortBy = document.getElementById('sortBy').value;
    const watchOnly = document.getElementById('watchOnly').checked;

    let list = rows.filter(r=>r.name.toLowerCase().includes(filter));
    if(watchOnly) list = list.filter(r=>watchlist.includes(r.name));
    list.sort((a,b)=> sortBy==='name' ? a.name.localeCompare(b.name) : b[sortBy]-a[sortBy]);

    document.getElementById('body').innerHTML = list.map(r=>{
      const watched = watchlist.includes(r.name);
      let row = `<td class="name"${watched?' style="color:var(--hot)"':''}>${watched?'★ ':''}${r.name} <span class="${r.lastOnline?'online':'offline'}">●</span></td>`;
      const rankCls = r.rankChange > 0 ? 'rank-up' : (r.rankChange < 0 ? 'rank-down' : 'rank-same');
      const rankArrow = r.rankChange > 0 ? '↑' : (r.rankChange < 0 ? '↓' : '·');
      row += `<td class="rank-cell">#${r.lastRank ?? '—'} <span class="${rankCls}">${rankArrow}${r.rankChange!==0?Math.abs(r.rankChange):''}</span></td>`;
      r.cells.forEach(c=>{
        const v = c.present ? (currentMetric==='score' ? c.ds : c.dr) : null;
        row += `<td>${fmt(v)}</td>`;
      });
      const series = currentMetric === 'score' ? r.scoreSeries : r.runeSeries;
      row += `<td>${sparkline(series, currentMetric==='score' ? 'var(--accent)' : 'var(--hot)')}</td>`;
      const total = currentMetric === 'score' ? r.totalScoreDelta : r.totalRuneDelta;
      row += `<td><b>${fmt(total)}</b></td>`;
      return `<tr>${row}</tr>`;
    }).join('');

    document.getElementById('summary').textContent =
      `Показано ${list.length} из ${rows.length} игроков · период (Киев): ${toKyiv(hours[0])} → ${toKyiv(hours[hours.length-1])}`;

    renderWatchChart();
  }

  document.getElementById('filter').addEventListener('input', draw);
  document.getElementById('sortBy').addEventListener('change', draw);
  renderTopCards();
  draw();
}

main().catch(e=>{
  document.getElementById('loading').textContent = 'Ошибка загрузки: ' + e.message;
});
</script>

</body>
</html>
